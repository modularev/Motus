; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy40

[env]
platform = teensy
board = teensy40
framework = arduino
lib_deps = 
	adafruit/Adafruit MPR121@~1.1.3
	adafruit/Adafruit MCP4728@^1.0.10
	blemasle/MCP23017@^2.0.0
	wifwaf/TCA9548A@^1.1.3
	toppenhoff/PCA9685
	paulstoffregen/Encoder@^1.4.4

[env:teensy40]

; streams raw electrode data over USB serial, see debugPrint in src/sensors.cpp
[env:teensy40_debug]
build_flags = -DMOTUS_DEBUG

; sets every DAC output to 0, 1365, 2730 or 4095 with SET 1-4, for measuring the output voltages
[env:teensy40_dactest]
build_flags = -DMOTUS_DAC_TEST
